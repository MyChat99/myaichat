name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Formatting
        run: npm run format:check

      # No secrets are provided on purpose. lib/env.ts parses lazily
      # (ISSUE-014), so a build must succeed with an empty environment — and
      # this job is what keeps that true. A build that needs runtime config is
      # a build that breaks on every fresh deploy.
      - name: Build
        run: npm run build

      # Needs the build output, so it lives here rather than in the tests job.
      - name: Bundle budget
        run: npm run verify:bundle

  tests:
    name: Tests (credential-free)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ⚠️ Only the suites that need NO database and NO network run here.
      #
      # The others (verify:rls, verify:admin, verify:chat, …) are deliberately
      # excluded: verify:admin MUTATES shared state — it disables a provider
      # and breaks a stored key, restoring both in `finally`. There is one
      # Supabase project behind local, CI and production, so a CI run that died
      # mid-suite would disable a provider for real users (ISSUE-015).
      #
      # To enable them, create a SEPARATE Supabase project for CI, add its
      # credentials as repository secrets, and add a job that runs them against
      # that project only. Never point this at production.
      - name: Theme contrast (WCAG AA)
        run: npm run verify:theme

      - name: Email templates
        run: npm run verify:email

      - name: Security headers
        run: npm run verify:headers

      # Source-level completeness check: catches a Server Action or route
      # handler shipped without an auth gate, which no runtime suite can see
      # because a runtime test only covers endpoints someone remembered to add.
      - name: Authorisation completeness
        run: npm run verify:authz

      - name: Composer attachment rules
        run: npm run verify:attachments

      # The mapper half is pure; the live half skips itself without a server.
      - name: Graceful degradation
        run: npm run verify:degradation

      - name: Retry policy and timeouts
        run: npm run verify:resilience

      # Captures real log output and greps it — not a check that the redaction
      # function works, a check that the logger does.
      - name: Structured logging
        run: npm run verify:logging

      - name: CSV export and injection
        run: npm run verify:csv

      # The idle-policy and marker-integrity halves are pure functions and run
      # here; the refresh-token measurement needs credentials and skips itself.
      - name: Session policy
        run: npm run verify:session

  # ------------------------------------------------------------ dependencies
  #
  # Separate from `security` on purpose. That job checks OUR code — committed
  # secrets, RLS coverage. This one checks the dependency tree, which we mostly
  # do not control. Merging them meant one red badge for two unrelated questions,
  # and the answer to "is this actionable?" differed between them.
  #
  # Non-blocking, and the report says why in its own footer: the advisories are
  # transitive under `next` and cannot clear without downgrading the framework
  # (ISSUE-006). A check that can never go green is a check people stop reading,
  # and the day a real one appears nobody would see it in the permanent red.
  dependencies:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the report
        run: npm run audit:report -- --out

      # Written to the job summary so it is readable without downloading
      # anything — an artifact you have to unzip is an artifact nobody opens.
      - name: Publish to the job summary
        if: always()
        run: cat audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-report.md
          retention-days: 30

  security:
    name: Security audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: reports without gating a merge. The dependency tree carries
    # known transitive advisories that cannot be fixed without downgrading
    # Next itself (ISSUE-006), so failing on them would block every PR
    # permanently and train everyone to ignore the check.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit
        run: npm run security:audit

  # ---------------------------------------------------------------- deploy
  #
  # DISABLED ON PURPOSE.
  #
  # Railway is already connected directly to this repository and deploys on
  # every push to main by itself. Enabling this job would produce TWO
  # deployments per merge, racing each other.
  #
  # To move deployment into CI (so it runs only after the gates above pass):
  #   1. In Railway → Settings → disable "Auto Deploy" on the GitHub trigger.
  #   2. Add a RAILWAY_TOKEN repository secret (Railway → Account → Tokens).
  #   3. Delete the `if: false` line below.
  #
  # Until step 1 is done, leaving this disabled is the correct state.
  deploy:
    name: Deploy to Railway (disabled)
    if: false
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        run: npx --yes @railway/cli up --service myaichat
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
