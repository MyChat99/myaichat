<title>Atlas — myaichat concept 04</title>

<!--
  ATLAS — concept 04 of 06
  ────────────────────────────────────────────────────────────────────────
  The first three concepts repainted a scrolling transcript. This one
  changes the interaction model.

  Your app already has "regenerate" and "edit and resubmit". Both create a
  BRANCH — and both currently destroy the path you were on. That's a real
  loss: the answer you discarded is often the one you wanted back.

  Here a conversation is a map. Every regenerate forks visibly, every edit
  starts a new limb, and nothing is thrown away. You pan and zoom it, you
  pick which branch is canonical, and the discarded ones stay put, dimmed,
  in case you were wrong.

  Drag the background to pan · scroll to zoom · click a node to make its
  path active.
-->

<style>
  :root {
    /* a pale celadon-grey — the neutral leans toward the canvas, not the ink */
    --canvas: #edf0ec;
    --canvas-2: #e3e8e3;
    --card: #ffffff;
    --ink: #171b19;
    --ink-2: #3c4441;
    --muted: #6c7671;
    --faint: #97a09b;
    --rule: #d6dcd6;
    --rule-2: #bfc7bf;

    --indigo: #3a35a8;   /* structure: links, the active path */
    --coral: #ea5334;    /* the live edge — where you are now */
    --anthropic: #c2603f;
    --openai: #0f9d78;

    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --spring: cubic-bezier(0.34, 1.4, 0.5, 1);
  }

  * { box-sizing: border-box; }

  .atlas {
    position: relative;
    height: 100vh;
    overflow: hidden;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    cursor: grab;
    user-select: none;
  }
  .atlas.dragging { cursor: grabbing; }

  /* the dot grid moves WITH the canvas, so panning has somewhere to read against */
  .grid {
    position: absolute; inset: -50%;
    background-image: radial-gradient(circle, var(--rule-2) 1.1px, transparent 1.1px);
    background-size: 26px 26px;
    opacity: 0.5;
    pointer-events: none;
  }

  .world {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: 0 0;
    will-change: transform;
  }

  #links { position: absolute; overflow: visible; pointer-events: none; left: 0; top: 0; }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; }

  .k {
    font-family: var(--mono);
    font-size: 9px; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--faint);
  }

  /* ═══════════════════════════════════════════ node */
  .node {
    position: absolute;
    width: 268px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 11px 13px 12px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgb(23 27 25 / 0.05), 0 4px 14px -6px rgb(23 27 25 / 0.14);
    transition:
      transform 0.32s var(--spring),
      box-shadow 0.32s var(--ease),
      border-color 0.32s,
      opacity 0.32s;
    opacity: 1;
  }
  .node:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgb(23 27 25 / 0.06), 0 14px 30px -10px rgb(23 27 25 / 0.24); }

  /* everything not on the chosen path recedes rather than disappearing */
  .node.off { opacity: 0.42; }
  .node.off:hover { opacity: 0.82; }

  .node.on { border-color: var(--indigo); box-shadow: 0 0 0 3px rgb(58 53 168 / 0.1), 0 12px 28px -12px rgb(23 27 25 / 0.3); }
  .node.live { border-color: var(--coral); box-shadow: 0 0 0 3px rgb(234 83 52 / 0.12), 0 14px 32px -12px rgb(234 83 52 / 0.35); }

  .node-h { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .who {
    font-family: var(--mono);
    font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .who.you { color: var(--indigo); }
  .who.a { color: var(--anthropic); }
  .who.o { color: var(--openai); }
  .node-n { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--faint); }

  .node-x {
    font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .node-f {
    display: flex; align-items: center; gap: 6px;
    margin-top: 9px; padding-top: 8px;
    border-top: 1px solid var(--rule);
  }
  .mini {
    font-family: var(--mono); font-size: 9px;
    padding: 2px 6px; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--muted);
    transition: border-color 0.18s, color 0.18s, background 0.18s;
  }
  .mini:hover { border-color: var(--indigo); color: var(--indigo); background: rgb(58 53 168 / 0.05); }
  .node-cost { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--faint); }

  /* a small tag marking a fork point */
  .fork {
    position: absolute; top: -9px; left: 13px;
    font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.1em;
    background: var(--coral); color: #fff;
    padding: 2px 6px; border-radius: 4px;
  }

  /* ═══════════════════════════════════════════ chrome */
  .dock {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    background: rgb(255 255 255 / 0.86);
    backdrop-filter: blur(14px);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: 0 6px 22px -10px rgb(23 27 25 / 0.28);
    overflow: hidden;
    cursor: default;
  }
  .dock-h {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 13px;
    border-bottom: 1px solid var(--rule);
  }
  .mark {
    width: 22px; height: 22px; border-radius: 6px;
    background: var(--indigo); color: #fff;
    display: grid; place-items: center; font-size: 11px; font-weight: 700;
  }
  .dock-t { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .dock-s { font-size: 10.5px; color: var(--muted); }

  .dock-b { display: flex; padding: 7px; gap: 4px; }
  .tool {
    width: 30px; height: 30px; border-radius: 7px;
    display: grid; place-items: center;
    color: var(--muted);
    transition: background 0.16s, color 0.16s;
  }
  .tool:hover { background: var(--canvas-2); color: var(--ink); }
  .tool[aria-pressed='true'] { background: var(--indigo); color: #fff; }
  .tool svg { width: 15px; height: 15px; }

  .legend {
    position: absolute; bottom: 16px; left: 16px; z-index: 10;
    background: rgb(255 255 255 / 0.86);
    backdrop-filter: blur(14px);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: default;
    display: grid; gap: 6px;
  }
  .leg { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .swatch { width: 16px; height: 2.5px; border-radius: 2px; flex: none; }

  .zoom {
    position: absolute; bottom: 16px; right: 16px; z-index: 10;
    display: flex; align-items: center;
    background: rgb(255 255 255 / 0.86);
    backdrop-filter: blur(14px);
    border: 1px solid var(--rule);
    border-radius: 9px;
    cursor: default; overflow: hidden;
  }
  .zoom button { padding: 7px 11px; color: var(--muted); transition: background 0.15s, color 0.15s; }
  .zoom button:hover { background: var(--canvas-2); color: var(--ink); }
  .zoom span {
    font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    padding: 0 4px; min-width: 46px; text-align: center;
    border-left: 1px solid var(--rule); border-right: 1px solid var(--rule);
  }

  /* the inspector for whichever node you last touched */
  .peek {
    position: absolute; top: 16px; right: 16px; z-index: 10;
    width: 264px;
    background: rgb(255 255 255 / 0.9);
    backdrop-filter: blur(16px);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: 0 8px 28px -12px rgb(23 27 25 / 0.3);
    cursor: default;
    overflow: hidden;
    transition: transform 0.4s var(--ease), opacity 0.35s;
  }
  .peek-h { padding: 11px 13px 9px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; }
  .peek-b { padding: 12px 13px; }
  .peek-x { font-size: 12.5px; line-height: 1.6; color: var(--ink-2); max-height: 190px; overflow-y: auto; }
  .peek-r { display: flex; justify-content: space-between; padding: 4px 0; font-size: 11px; }
  .peek-r span:first-child { color: var(--faint); }
  .peek-r span:last-child { font-family: var(--mono); }
  .peek-f { padding: 9px 13px 11px; border-top: 1px solid var(--rule); display: flex; gap: 6px; }
  .btn {
    flex: 1; padding: 6px 0; border-radius: 7px;
    font-size: 11.5px; text-align: center;
    border: 1px solid var(--rule);
    transition: background 0.16s, border-color 0.16s, color 0.16s;
  }
  .btn:hover { background: var(--canvas-2); border-color: var(--rule-2); }
  .btn.pri { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .btn.pri:hover { filter: brightness(1.12); background: var(--indigo); }

  /* the composer floats too — it belongs to the map, not to a window edge */
  .ask {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; width: min(560px, calc(100% - 340px));
    background: var(--card);
    border: 1px solid var(--rule-2);
    border-radius: 13px;
    box-shadow: 0 10px 34px -14px rgb(23 27 25 / 0.4);
    cursor: default;
    transition: box-shadow 0.3s, border-color 0.3s;
  }
  .ask:hover { border-color: var(--indigo); box-shadow: 0 14px 40px -14px rgb(23 27 25 / 0.5); }
  .ask-f { padding: 12px 14px 7px; font-size: 13.5px; color: var(--faint); }
  .ask-b { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 8px 12px; border-top: 1px solid var(--rule); }
  .ctx { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .send {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--coral); color: #fff;
    display: grid; place-items: center;
    transition: transform 0.24s var(--spring), filter 0.2s;
  }
  .send:hover { transform: scale(1.1) rotate(-6deg); filter: brightness(1.08); }
  .send:active { transform: scale(0.94); }
  .send svg { width: 14px; height: 14px; }

  /* ═══════════════════════════════════════════ motion */
  @keyframes pop { from { opacity: 0; transform: scale(0.9) translateY(8px); } to { opacity: 1; transform: none; } }
  .node { animation: pop 0.5s var(--spring) both; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  .link { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.1s var(--ease) forwards; }

  @keyframes drop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  .dock, .peek { animation: drop 0.55s 0.15s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .legend, .zoom { animation: rise 0.55s 0.2s var(--ease) both; }
  .ask { animation: rise 0.55s 0.25s var(--ease) both; }
  .ask { transform: translateX(-50%); }
  @keyframes riseC { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%); } }
  .ask { animation-name: riseC; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .link { stroke-dashoffset: 0; }
  }

  @media (max-width: 900px) { .peek { display: none; } .ask { width: calc(100% - 32px); } }
</style>

<div class="atlas" id="atlas">
  <div class="grid" id="grid"></div>

  <div class="world" id="world">
    <svg id="links" width="2600" height="1800"></svg>
    <div id="nodes"></div>
  </div>

  <!-- ═══════════════════ dock -->
  <div class="dock">
    <div class="dock-h">
      <div class="mark">m</div>
      <div>
        <div class="dock-t">Explaining closures</div>
        <div class="dock-s">9 nodes · 3 branches · 2 models</div>
      </div>
    </div>
    <div class="dock-b">
      <button class="tool" aria-pressed="true" title="Select">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m4 3 7.5 18 2.2-7.3L21 11.5z"/></svg>
      </button>
      <button class="tool" title="Pan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2a8 8 0 0 1-7-4l-2.5-4a2 2 0 0 1 3.4-2L8 15"/></svg>
      </button>
      <button class="tool" id="fit" title="Fit to view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
      <button class="tool" id="only" title="Hide discarded branches">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <!-- ═══════════════════ legend -->
  <div class="legend">
    <div class="leg"><span class="swatch" style="background: var(--indigo)"></span> Chosen path</div>
    <div class="leg"><span class="swatch" style="background: var(--rule-2)"></span> Kept, not chosen</div>
    <div class="leg"><span class="swatch" style="background: var(--coral)"></span> Where you are now</div>
  </div>

  <!-- ═══════════════════ zoom -->
  <div class="zoom">
    <button id="out2">−</button>
    <span id="zval">100%</span>
    <button id="in2">+</button>
  </div>

  <!-- ═══════════════════ peek -->
  <aside class="peek" id="peek">
    <div class="peek-h">
      <span class="k">Node</span>
      <span class="k" id="peekId">n-07</span>
    </div>
    <div class="peek-b">
      <div class="peek-x" id="peekText">Select a node on the map to read it in full.</div>
    </div>
    <div class="peek-b" style="padding-top: 0">
      <div class="peek-r"><span>model</span><span id="peekModel">—</span></div>
      <div class="peek-r"><span>tokens</span><span id="peekTok">—</span></div>
      <div class="peek-r"><span>cost</span><span id="peekCost">—</span></div>
      <div class="peek-r"><span>branch</span><span id="peekBranch">—</span></div>
    </div>
    <div class="peek-f">
      <button class="btn" id="btnFork">Fork here</button>
      <button class="btn pri" id="btnChoose">Make canonical</button>
    </div>
  </aside>

  <!-- ═══════════════════ composer -->
  <div class="ask">
    <div class="ask-f">Continue from the selected node…</div>
    <div class="ask-b">
      <div class="ctx">
        <span class="dot" style="background: var(--anthropic)"></span>
        <span>Haiku 4.5</span>
        <span style="color: var(--faint)">· continues from n-07</span>
      </div>
      <button class="send" id="grow" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  (function () {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const $ = (id) => document.getElementById(id);

    /* ══════════════════════════════════════════ the map
       Positions are authored, not computed: a conversation graph is small
       and read by a human, so a hand-placed layout beats anything a force
       simulation produces — the latter is legible for about four nodes and
       a plate of spaghetti after that. */
    const NODES = [
      { id: 'n-01', x: 60,  y: 300, role: 'you',
        text: 'Explain closures in JavaScript with an example I could actually use.',
        tok: 14, cost: 0.000014, branch: 'main', path: true },

      { id: 'n-02', x: 380, y: 300, role: 'a', model: 'Haiku 4.5',
        text: 'A closure is a function that keeps hold of the variables around it, even after the function that created those variables has returned. The practical version: it is how you make private state without a class.',
        tok: 186, cost: 0.00093, branch: 'main', path: true },

      { id: 'n-03', x: 700, y: 300, role: 'you',
        text: "Give me the counter example, but explain why the naive version leaks.",
        tok: 16, cost: 0.000016, branch: 'main', path: true, fork: '3 attempts' },

      /* three attempts at the same answer — the fork */
      { id: 'n-04', x: 1020, y: 120, role: 'a', model: 'Haiku 4.5',
        text: 'Here is the counter with a closure over `count`. The naive version puts `count` on the module scope, so every call site shares one counter and nothing can be garbage collected while the module lives.',
        tok: 240, cost: 0.0012, branch: 'attempt 1' },

      { id: 'n-05', x: 1020, y: 300, role: 'a', model: 'Haiku 4.5',
        text: 'The leak is not really about closures — it is about lifetime. A closure keeps its entire enclosing scope alive, so capturing one small number from a function that also allocated a 10MB buffer keeps the buffer too. That is the bit people miss.',
        tok: 268, cost: 0.00134, branch: 'attempt 2', path: true },

      { id: 'n-06', x: 1020, y: 480, role: 'o', model: 'GPT-5.4 mini',
        text: 'Same question, different provider. A counter factory returns a function closed over a local `count`; the naive version hoists `count` out and every consumer mutates the same value.',
        tok: 212, cost: 0.00042, branch: 'attempt 3 · other model' },

      { id: 'n-07', x: 1340, y: 300, role: 'you',
        text: 'The lifetime point is the one I want. Show me how to prove it in devtools.',
        tok: 18, cost: 0.000018, branch: 'attempt 2', path: true, live: true },

      { id: 'n-08', x: 1660, y: 300, role: 'a', model: 'Haiku 4.5',
        text: 'Take a heap snapshot, run the factory a thousand times, take a second snapshot and compare retained size. Filter for the closure entry — the retained size will include the buffer even though nothing references it directly.',
        tok: 294, cost: 0.00147, branch: 'attempt 2', path: true },

      { id: 'n-09', x: 1660, y: 480, role: 'a', model: 'Haiku 4.5',
        text: 'Alternative: use the Allocation instrumentation timeline instead of snapshots — it shows the allocation staying live rather than the size after the fact.',
        tok: 154, cost: 0.00077, branch: 'attempt 2 · regenerated' },
    ];

    const EDGES = [
      ['n-01', 'n-02'], ['n-02', 'n-03'],
      ['n-03', 'n-04'], ['n-03', 'n-05'], ['n-03', 'n-06'],
      ['n-05', 'n-07'], ['n-07', 'n-08'], ['n-07', 'n-09'],
    ];

    const byId = Object.fromEntries(NODES.map((n) => [n.id, n]));
    const nodesEl = $('nodes');
    const svg = $('links');

    const LABEL = { you: ['you', 'You'], a: ['a', 'Claude'], o: ['o', 'GPT'] };

    NODES.forEach((n, i) => {
      const el = document.createElement('div');
      el.className = 'node' + (n.path ? ' on' : ' off') + (n.live ? ' live' : '');
      el.style.left = n.x + 'px';
      el.style.top = n.y + 'px';
      el.style.animationDelay = 0.1 + i * 0.05 + 's';
      el.dataset.id = n.id;

      const [cls, name] = LABEL[n.role];
      el.innerHTML =
        (n.fork ? '<span class="fork">' + n.fork + '</span>' : '') +
        '<div class="node-h">' +
          '<span class="who ' + cls + '">' + (n.model || name) + '</span>' +
          '<span class="node-n">' + n.id + '</span>' +
        '</div>' +
        '<div class="node-x">' + n.text + '</div>' +
        '<div class="node-f">' +
          '<span class="mini">branch</span>' +
          '<span class="mini">retry</span>' +
          '<span class="node-cost">' + n.tok + ' tok</span>' +
        '</div>';

      el.addEventListener('click', (e) => { e.stopPropagation(); select(n.id); });
      nodesEl.appendChild(el);
    });

    /* edges: a horizontal-first bezier, so siblings fan out cleanly from one
       parent rather than crossing each other */
    function drawEdges() {
      svg.innerHTML = '';
      EDGES.forEach(([from, to], i) => {
        const a = byId[from], b = byId[to];
        const x1 = a.x + 268, y1 = a.y + 52;
        const x2 = b.x, y2 = b.y + 52;
        const dx = Math.max(40, (x2 - x1) * 0.55);

        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' ' + (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2);
        p.setAttribute('fill', 'none');
        const onPath = a.path && b.path;
        p.setAttribute('stroke', onPath ? 'var(--indigo)' : 'var(--rule-2)');
        p.setAttribute('stroke-width', onPath ? '2' : '1.4');
        p.setAttribute('opacity', onPath ? '0.85' : '0.55');
        p.classList.add('link');
        p.style.animationDelay = 0.25 + i * 0.06 + 's';
        svg.appendChild(p);

        // a small node where the edge lands, so arrival is readable at low zoom
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', x2); c.setAttribute('cy', y2); c.setAttribute('r', onPath ? 3.2 : 2.4);
        c.setAttribute('fill', onPath ? 'var(--indigo)' : 'var(--rule-2)');
        svg.appendChild(c);
      });
    }
    drawEdges();

    /* ══════════════════════════════════════════ selection */
    function select(id) {
      const n = byId[id];
      document.querySelectorAll('.node').forEach((el) => {
        el.classList.toggle('live', el.dataset.id === id);
      });
      $('peekId').textContent = n.id;
      $('peekText').textContent = n.text;
      $('peekModel').textContent = n.model || 'you';
      $('peekTok').textContent = n.tok + ' tok';
      $('peekCost').textContent = '$' + n.cost.toFixed(6);
      $('peekBranch').textContent = n.branch;
    }
    select('n-07');

    /* make a discarded branch canonical — the path re-routes and redraws */
    $('btnChoose').addEventListener('click', () => {
      const id = $('peekId').textContent;
      // walk back to the root through the edges, marking that chain
      NODES.forEach((n) => (n.path = false));
      let cur = id;
      const guard = new Set();
      while (cur && !guard.has(cur)) {
        guard.add(cur);
        byId[cur].path = true;
        const edge = EDGES.find((e) => e[1] === cur);
        cur = edge ? edge[0] : null;
      }
      document.querySelectorAll('.node').forEach((el) => {
        const on = byId[el.dataset.id].path;
        el.classList.toggle('on', on);
        el.classList.toggle('off', !on);
      });
      drawEdges();
    });

    /* ══════════════════════════════════════════ pan and zoom */
    const world = $('world'), grid = $('grid'), atlas = $('atlas');
    let scale = 0.62, tx = 40, ty = 20;
    let panning = false, sx = 0, sy = 0;

    function apply() {
      world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
      grid.style.backgroundPosition = tx + 'px ' + ty + 'px';
      grid.style.backgroundSize = 26 * scale + 'px ' + 26 * scale + 'px';
      $('zval').textContent = Math.round(scale * 100) + '%';
    }
    apply();

    atlas.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.dock, .peek, .ask, .zoom, .legend, .node')) return;
      panning = true; sx = e.clientX - tx; sy = e.clientY - ty;
      atlas.classList.add('dragging');
      atlas.setPointerCapture(e.pointerId);
    });
    atlas.addEventListener('pointermove', (e) => {
      if (!panning) return;
      tx = e.clientX - sx; ty = e.clientY - sy;
      apply();
    });
    atlas.addEventListener('pointerup', () => { panning = false; atlas.classList.remove('dragging'); });
    atlas.addEventListener('pointercancel', () => { panning = false; atlas.classList.remove('dragging'); });

    atlas.addEventListener('wheel', (e) => {
      if (e.target.closest('.peek, .dock')) return;
      e.preventDefault();
      // zoom toward the pointer, not the origin — otherwise the thing you are
      // looking at slides off screen every time you zoom in
      const prev = scale;
      scale = Math.min(1.6, Math.max(0.28, scale * (e.deltaY > 0 ? 0.92 : 1.08)));
      tx = e.clientX - (e.clientX - tx) * (scale / prev);
      ty = e.clientY - (e.clientY - ty) * (scale / prev);
      apply();
    }, { passive: false });

    function zoomBy(f) {
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      const prev = scale;
      scale = Math.min(1.6, Math.max(0.28, scale * f));
      tx = cx - (cx - tx) * (scale / prev);
      ty = cy - (cy - ty) * (scale / prev);
      apply();
    }
    $('in2').addEventListener('click', () => zoomBy(1.18));
    $('out2').addEventListener('click', () => zoomBy(0.85));
    $('fit').addEventListener('click', () => { scale = 0.44; tx = 30; ty = 90; apply(); });

    let hideOff = false;
    $('only').addEventListener('click', function () {
      hideOff = !hideOff;
      this.setAttribute('aria-pressed', String(hideOff));
      document.querySelectorAll('.node.off').forEach((el) => {
        el.style.display = hideOff ? 'none' : '';
      });
    });

    /* ══════════════════════════════════════════ growing the map */
    let grown = 0;
    function grow() {
      grown++;
      const parent = byId[$('peekId').textContent] || byId['n-07'];
      const id = 'n-' + String(10 + grown).padStart(2, '0');

      const fresh = {
        id, x: parent.x + 320, y: parent.y + (grown % 2 ? 180 : -180),
        role: 'a', model: 'Haiku 4.5',
        text: 'A new limb, grown from ' + parent.id + '. Nothing above it was overwritten — the branch you were on is still there, one click away.',
        tok: 120 + Math.floor(Math.random() * 160),
        cost: 0.0009, branch: 'from ' + parent.id, path: false,
      };

      NODES.push(fresh);
      byId[id] = fresh;
      EDGES.push([parent.id, id]);

      const el = document.createElement('div');
      el.className = 'node live';
      el.style.left = fresh.x + 'px';
      el.style.top = fresh.y + 'px';
      el.dataset.id = id;
      el.innerHTML =
        '<div class="node-h"><span class="who a">' + fresh.model + '</span><span class="node-n">' + id + '</span></div>' +
        '<div class="node-x"></div>' +
        '<div class="node-f"><span class="mini">branch</span><span class="mini">retry</span>' +
        '<span class="node-cost">' + fresh.tok + ' tok</span></div>';
      el.addEventListener('click', (e) => { e.stopPropagation(); select(id); });
      nodesEl.appendChild(el);
      drawEdges();

      // pan so the new node is on screen, then type into it
      tx = -(fresh.x * scale) + window.innerWidth * 0.52;
      ty = -(fresh.y * scale) + window.innerHeight * 0.38;
      apply();

      const target = el.querySelector('.node-x');
      if (reduced) { target.textContent = fresh.text; select(id); return; }
      let i = 0;
      (function type() {
        if (i >= fresh.text.length) { select(id); return; }
        i += 2;
        target.textContent = fresh.text.slice(0, i);
        setTimeout(type, 16);
      })();
    }

    $('grow').addEventListener('click', grow);
    $('btnFork').addEventListener('click', grow);
  })();
</script>
